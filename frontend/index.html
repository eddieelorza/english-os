<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>English OS</title>
    <script>
      /* Before first paint, or Night flashes white on every load. ui/Shell.tsx keeps it true after. */
      (function () {
        var saved = null
        try {
          saved = localStorage.getItem('theme')
        } catch (e) {}
        var night = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = night ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <!--
    THESIS: Eddie's vocabulary as a living Assimil course workbook — a numbered
    bilingual ledger where the Spanish column stays covered until asked. Refuses
    the card-grid learning-app default.
    OWN-WORLD: near-white paper #FBFAF7, ink #16181C, structural cobalt #0A52C4
    (rail, rules, active states), correction red #C6402D reserved. Archivo for
    apparatus, Source Serif 4 for the book voice. Hairline rules; tabular counts
    right-aligned; NEW entries unlit (ghost); status as margin hairline marks.
    STORY: Eddie opens his course book, sees exact counts of what he holds,
    scans the ledger, uncovers Spanish only when recall fails, edits status.
    FIRST VIEWPORT: paper rail with a cobalt spine, the lessons grouped by what
    they do; on a phone, a five-place tab bar. See DESIGN.md, The Annotated Edition.
    FORM: Assimil workbook, candidate 4 of 7, seed 62149694 (code-led).
    FINISH: unreviewed and undocumented is unfinished; this build ends with the
    finish review, the verdict, DESIGN.md, and every shipping raster carrying
    its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
